name: OpenSandbox contributor validation

on:
  push:
    branches: ['validation/opensandbox-sdk-20261016-120e76b']

permissions:
  contents: read

jobs:
  blocking-and-real-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Install standard backend test environment
        run: uv sync --group dev
      - name: Run complete strict blocking IO gate before optional SDK installation
        run: make test-blocking-io
      - name: Install the exact locked optional SDK without replacing locked dependencies
        run: |
          printf '%s\n' 'opensandbox==0.1.15 --hash=sha256:992b01490551f4d8e3f99caa25e34cb9d1690f0c5027eeebab912738291957d1' > /tmp/opensandbox-locked.txt
          uv pip install --python .venv/bin/python --no-deps --require-hashes -r /tmp/opensandbox-locked.txt
          .venv/bin/python -c 'from opensandbox.sync import SandboxSync, SandboxManagerSync'
      - name: Run offline lifecycle and real SDK HTTP regressions
        env:
          PYTHONPATH: .
        run: >-
          .venv/bin/python -m pytest
          tests/test_opensandbox_lifecycle.py
          tests/test_opensandbox_lifecycle_sdk.py
          tests/test_opensandbox_provider.py
          -q --tb=short
